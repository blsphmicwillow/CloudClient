# Cloud Client build properties.
#
# 1.8.9 constrains us to ForgeGradle 2.1 + Gradle 2.14.x, which in turn needs a
# JDK 8 (or 11 with --release 8). Do not bump these to modern Forge versions:
# 1.8.9 Forge does not exist outside the 11.15.x line.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true

mod_id=cloudclient
mod_name=Cloud Client
mod_version=0.1.1
mod_group=net.cloudclient

minecraft_version=1.8.9
forge_version=11.15.1.2318-1.8.9
mappings_version=stable_22
