/*
 * Cloud Client — Forge 1.8.9 build.
 *
 * IMPORTANT: 1.8.9 is pinned to the forge-1.8.9-11.15.x line and ForgeGradle
 * 2.1, which needs Gradle 2.14.x and a JDK 8 toolchain. Do not "upgrade" these
 * to modern Forge: 1.8.9 has no newer Forge.
 *
 * No Mixin: every hook this mod needs is a public Forge event. That keeps the
 * jar self-contained (nothing else to install) and avoids the 1.8.9 annotation
 * processor's MCP -> notch mapping problems.
 *
 * Layout: all platform-independent engine code lives in src/core/java and has
 * no Minecraft imports, so it can be compiled and unit-tested with a bare JDK
 * (see tools/). The Forge glue lives in src/main/java.
 */
buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle',
                version: '2.1-SNAPSHOT', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = project.mod_version
group = project.mod_group
archivesBaseName = 'cloud-client'

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

minecraft {
    version = "${project.minecraft_version}-${project.forge_version}"
    runDir = 'run'
    // stable_20 was purged from Forge's maven; stable_22 is the remaining
    // 1.8.9 mappings channel and is what this project is built against.
    mappings = project.mappings_version
}

repositories {
    mavenCentral()
}

dependencies {
    // Intentionally empty: no runtime dependencies outside Forge itself.
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'src/core/java']
        }
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

// Writes the git hash and build time into the jar, so a single log line says
// exactly which build is running. A stale jar in mods/ once looked like a fix
// that had not worked.
def buildStampDir = new File(buildDir, 'generated')
def buildStampFile = new File(buildStampDir, 'cloudclient-build.properties')

task buildStamp {
    outputs.file buildStampFile
    doLast {
        String hash = 'unknown'
        try {
            def process = 'git rev-parse --short HEAD'.execute()
            process.waitFor()
            if (process.exitValue() == 0) hash = process.text.trim()
        } catch (Exception ignored) {
            // Not a git checkout; the timestamp alone still identifies the build.
        }
        buildStampDir.mkdirs()
        def stamp = 'build=' + hash + '\ntime=' + new Date().format('yyyy-MM-dd HH:mm') + '\n'
        buildStampFile.text = stamp
    }
}

sourceSets.main.resources.srcDir buildStampDir
processResources.dependsOn buildStamp

jar {
    manifest {
        attributes(
                'Implementation-Version': project.version,
                'FMLAT': ''
        )
    }
}

// Runs the platform-independent engine tests on a bare JVM.
task coreTest(type: JavaExec, dependsOn: 'classes') {
    description = 'Runs the engine tests (no Minecraft needed for the logic itself).'
    classpath = sourceSets.main.runtimeClasspath
    main = 'net.cloudclient.test.CoreTests'
}

// Prints the dev launch classpath so the game can be started without
// ForgeGradle's (now broken) http:// asset downloader.
task printClasspath {
    doLast {
        println sourceSets.main.runtimeClasspath.asPath
    }
}
